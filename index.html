<title>ابزارآلات مجتبی</title>
<style>

:root{--bg:#ece4d2;--card:#f8f2e3;--tx:#2a2216;--mu:#7b6a4d;--pr:#0f5e63;--ac:var(--neon);--neon:#00f0d0;--c:#0f6a70;--bd:#d2c3a1;--rd:#b3261e;--gn:#1b7a46;--fr:repeating-linear-gradient(90deg,rgba(184,137,58,.55) 0 3px,transparent 3px 7px,rgba(184,137,58,.3) 7px 9px,transparent 9px 16px)}
html[data-mode=dark]{--bg:#16130d;--card:#201b12;--tx:#efe5cc;--mu:#a89873;--pr:#4fd0c4;--bd:#3b3322;--rd:#ff8a80;--gn:#6fd49a}
*{box-sizing:border-box}html{min-height:100%}body{min-height:100vh;margin:0;background:radial-gradient(circle at 20% 0,rgba(255,255,255,.35),transparent 60%),var(--bg);color:var(--tx);font:15px/1.7 Tahoma,sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
header{position:relative;background:var(--fr),linear-gradient(var(--c),color-mix(in srgb,var(--c) 45%,#000));background-size:100% 6px,100% 100%;background-repeat:repeat-x,no-repeat;background-position:bottom,0 0;border-bottom:4px solid var(--ac);box-shadow:0 3px 10px rgba(0,0,0,.25);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;padding-bottom:16px}
main{padding:12px;max-width:700px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:6px;box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--bd),0 4px 10px rgba(60,40,0,.12);padding:12px;margin:0 4px 14px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px;width:100%;margin:4px 0}
button{width:auto;cursor:pointer;min-height:44px;background:var(--card)}button.p{background:linear-gradient(color-mix(in srgb,var(--c) 82%,#fff),var(--c));color:#fff;border-color:color-mix(in srgb,var(--c) 70%,#000);box-shadow:inset 0 1px rgba(255,255,255,.25)}h2,h3{color:var(--pr)}h2::before,h3::before{content:'';display:inline-block;width:16px;height:16px;margin-inline-end:6px;background:var(--ac);-webkit-mask:var(--m-ros) center/contain no-repeat;mask:var(--m-ros) center/contain no-repeat;vertical-align:-2px}button.d{color:var(--rd)}button.w{width:100%}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.row>*{margin:0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mu{color:var(--mu);font-size:13px}.pr{color:var(--pr);font-weight:bold}.tag{font-size:12px;padding:1px 10px;border-radius:99px;border:1px solid var(--bd)}
.qty{display:flex;align-items:center;gap:8px}.qty button{padding:2px 16px;font-size:20px}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:3px double var(--ac)}
nav button{flex:1;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;border-radius:0;margin:0;font-size:11px;background:none;white-space:nowrap;padding:6px 2px}nav button.on{color:var(--pr);font-weight:bold;box-shadow:inset 0 -3px var(--ac)}
img.pi{width:100%;max-height:190px;object-fit:cover;border-radius:10px;background:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px;border-bottom:1px solid var(--bd);text-align:right}
.center{min-height:80vh;display:flex;align-items:center}.center .card{width:100%;max-width:380px;margin:auto;text-align:center;padding:24px 18px;border-radius:6px}
.logo{width:76px;height:76px;border-radius:6px;background:linear-gradient(145deg,#0f5e63,#073337);border:3px solid var(--ac);box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--ac);margin:0 auto 6px;display:flex;align-items:center;justify-content:center}
.loyalty{background:linear-gradient(135deg,rgba(0,240,208,.10),rgba(35,70,95,.06));border:1px solid rgba(0,240,208,.55);box-shadow:0 0 10px rgba(0,240,208,.16),inset 0 0 18px rgba(0,240,208,.06)}.loyalty-rank{font-weight:bold;text-shadow:0 0 9px currentColor}.loyalty-track{height:13px;border-radius:20px;background:rgba(120,140,150,.2);border:1px solid rgba(0,240,208,.35);overflow:hidden;margin:13px 0 8px}.loyalty-fill{height:100%;border-radius:20px;transition:width .4s ease;min-width:0}
#toast{position:fixed;top:70px;inset-inline:16px;background:var(--pr);color:#fff;padding:10px 14px;border-radius:10px;z-index:9;display:none;text-align:center}

function tinaPick(el){const f=el.files[0];if(f)resize(f,1600,x=>{S.tinaImg=x;const p=$('t_prev');p.src='data:image/jpeg;base64,'+x.data;p.hidden=false})}
function aTina(){const t=S.tina;
 if(!t||t.step==='in')return `<div class="card"><h3>تینا | دستیار هوشمند فاکتور</h3><div class="g2"><button class="${S.tinaMode==='buy'?'p':''}" onclick="S.tinaMode='buy';S.tinaImg=null;draw()">📥 فاکتور خرید انبار</button><button class="${S.tinaMode==='sale'?'p':''}" onclick="S.tinaMode='sale';S.tinaImg=null;draw()">🧾 ثبت فاکتور فروش</button></div><div class="mu">${S.tinaMode==='buy'?'فاکتور خرید را بخوانید و پس از بررسی، موجودی را ثبت کنید.':'فاکتور فروش را بخوانید؛ پس از تأیید، مبلغ آن به خریدهای تکمیل‌شده مشتری اضافه می‌شود.'}</div>
  ${picker('tinaPick')}<img id="t_prev" class="pi" hidden><textarea id="t_text" placeholder="یا متن فاکتور را اینجا بچسبانید"></textarea>
  <button class="p w" onclick="tinaRun()">خواندن فاکتور با تینا</button>${S.tinaMode==='buy'?'<button class="w" onclick="S.tina={step:\'rev\',seller:\'\',date:\'\',rial:false,margin:35,rows:[{name:\'\',qty:1,unit:0,match:\'\',review:false}]};draw()">ثبت دستی خرید</button>':''}</div>`;
 if(t.step==='busy')return '<div class="card">تینا در حال خواندن فاکتور است…</div>';
 if(t.step==='sale')return `<div class="card"><h3>بررسی فاکتور فروش</h3><div class="mu">اطلاعات استخراج‌شده را بررسی و در صورت نیاز اصلاح کنید. مشتری باید قبلاً در فروشگاه ثبت‌نام کرده باشد.</div><input id="sale_customer" placeholder="نام مشتری" value="${esc(t.customer_name||'')}"><input id="sale_phone" inputmode="tel" placeholder="شماره موبایل مشتری (برای تشخیص دقیق)" value="${esc(t.customer_phone||'')}"><div class="g2"><input id="sale_date" type="date" value="${esc(t.date||'')}"><input id="sale_total" inputmode="numeric" placeholder="مبلغ کل به تومان" value="${t.total||''}"></div><div class="row"><button class="p" onclick="saveSaleInvoice()">ثبت فاکتور فروش</button><button onclick="S.tina=null;S.tinaImg=null;draw()">لغو</button></div></div>`;
 const w=x=>x?'':'style="border-color:var(--rd)"';
 return `<div class="card"><h3>بررسی فاکتور خرید</h3><div class="mu">فیلدهای قرمز را کامل کنید.</div><div class="g2"><input id="t_seller" placeholder="نام فروشنده (اختیاری)" value="${esc(t.seller)}"><input id="t_date" type="date" value="${esc(t.date)}"></div><select id="t_rial"><option value="1">تومان</option><option value="10" ${t.rial?'selected':''}>ریال</option></select><input id="t_margin" inputmode="numeric" value="${t.margin}" placeholder="درصد سود"><div class="mu">درصد سود برای کالاهای جدید.</div></div>
 ${t.rows.map((r,i)=>`<div class="card" ${r.review?'style="border-color:var(--rd)"':''}><input id="t_n${i}" placeholder="نام کالا" value="${esc(r.name)}" ${w(r.name)}><div class="g2"><input id="t_q${i}" inputmode="numeric" placeholder="تعداد" value="${r.qty||''}" ${w(r.qty)}><input id="t_u${i}" inputmode="numeric" placeholder="قیمت خرید واحد" value="${r.unit||''}" ${w(r.unit)}></div><select id="t_m${i}"><option value="">کالای جدید</option>${S.prods.map(p=>`<option value="${p.id}" ${String(r.match)===String(p.id)?'selected':''}>تطبیق با: ${esc(p.name)}</option>`).join('')}</select><button class="d" onclick="tinaRead();S.tina.rows.splice(${i},1);draw()">حذف ردیف</button></div>`).join('')}
 <div class="row"><button onclick="tinaRead();S.tina.rows.push({name:'',qty:1,unit:0,match:'',review:false});draw()">+ ردیف</button><button class="p" onclick="tinaConfirm()">تأیید و ثبت در موجودی</button><button onclick="S.tina=null;S.tinaImg=null;draw()">انصراف</button></div>`}
function tinaRead(){const t=S.tina;t.seller=val('t_seller');t.date=val('t_date');t.rial=val('t_rial')==='10';t.margin=nn(val('t_margin'));t.rows.forEach((r,i)=>{r.name=val('t_n'+i);r.qty=nn(val('t_q'+i));r.unit=nn(val('t_u'+i));r.match=val('t_m'+i)})}
const tinaRun=go(async()=>{const text=val('t_text').trim(),mode=S.tinaMode;if(!S.tinaImg&&!text)return toast('عکس یا متن فاکتور را وارد کنید');S.tina={step:'busy'};draw();try{if(mode==='sale'){const r=await api('POST','/api/admin/tina/extract-sale',{image:S.tinaImg||undefined,text:text||undefined});S.tina={step:'sale',customer_name:r.customer_name||'',customer_phone:r.customer_phone||'',date:r.date||'',total:r.total||''}}else{const r=await api('POST','/api/admin/tina/extract',{image:S.tinaImg||undefined,text:text||undefined});S.tina={step:'rev',seller:r.seller||'',date:r.date||'',rial:r.rial,margin:35,rows:r.rows.length?r.rows.map(x=>({name:x.name,qty:x.qty,unit:x.unit_price,match:x.match_id||'',review:x.needs_review})):[{name:'',qty:1,unit:0,match:'',review:false}]}}}catch(e){S.tina={step:'in'};throw e}draw()});
const saveSaleInvoice=go(async()=>{const body={customer_name:val('sale_customer'),customer_phone:val('sale_phone'),date:val('sale_date'),total:nn(val('sale_total'))};if(!body.customer_name||body.total<1)return toast('نام مشتری و مبلغ را کامل کنید');await api('POST','/api/admin/invoices/sales',body);S.tina=null;S.tinaImg=null;await load();draw();toast('فاکتور فروش ثبت شد و در امتیاز مشتری محاسبه می‌شود')});
const tinaConfirm=go(async()=>{tinaRead();const t=S.tina,k=t.rial?10:1;
 if(!t.rows.length||t.rows.some(r=>!r.name||r.qty<1||r.unit<1))return toast('همه فیلدهای قرمز را کامل کنید');
 await api('POST','/api/admin/invoices/confirm',{seller:t.seller,date:t.date,image:S.tinaImg||undefined,rows:t.rows.map(r=>({name:r.name,qty:r.qty,unit_price:Math.round(r.unit/k),product_id:r.match||null,margin_percent:t.margin}))});
 S.tina=null;S.tinaImg=null;S.open={};S.hist={};await load();S.tab='prods';draw();toast('خرید در موجودی ثبت شد. قیمت فروش کالاهای جدید را در تب محصولات تعیین و فعال کنید.')});
function aTiers(){const L=S.tiers||[];return `<div class="card"><h3>🏆 مدیریت باشگاه مشتریان</h3><div class="mu">رتبه‌ها بر اساس مجموع سفارش‌های تکمیل‌شده هر مشتری محاسبه می‌شوند.</div><input id="tier_name" placeholder="نام رتبه، مثلاً طلایی"><div class="g2"><input id="tier_min" inputmode="numeric" placeholder="حداقل خرید (تومان)"><input id="tier_icon" placeholder="ایموجی رتبه، مثلاً 🥇"></div><div class="row"><label>رنگ رتبه</label><input id="tier_color" type="color" value="#00f0d0" style="width:70px;height:45px;padding:3px"></div><button class="p w" onclick="saveTier()">افزودن رتبه</button></div>${L.map(x=>`<div class="card"><div class="row"><b style="color:${esc(x.color)}">${esc(x.icon)} ${esc(x.name)}</b><b>${T(x.min_amount)}</b></div><div class="row"><span class="mu">حداقل خرید برای این رتبه</span><span><button onclick="editTier(${x.id})">ویرایش</button><button class="d" onclick="deleteTier(${x.id})">حذف</button></span></div></div>`).join('')||'<div class="card mu">رتبه‌ای ثبت نشده است.</div>'}`}
const loadTiers=go(async()=>{S.tiers=await api('GET','/api/admin/tiers');draw()});
const saveTier=go(async()=>{const b={name:val('tier_name'),min_amount:nn(val('tier_min')),icon:val('tier_icon')||'⭐',color:val('tier_color')};if(!b.name)return toast('نام رتبه را وارد کنید');await api('POST','/api/admin/tiers',{op:'save',...b});S.tiers=await api('GET','/api/admin/tiers');draw();toast('رتبه ذخیره شد')});
const editTier=id=>{const x=S.tiers.find(y=>y.id===id);if(!x)return;const name=prompt('نام رتبه',x.name);if(name===null)return;const amount=prompt('حداقل خرید به تومان',x.min_amount);if(amount===null)return;const icon=prompt('ایموجی رتبه',x.icon);if(icon===null)return;const color=prompt('کد رنگ (مثلاً #00f0d0)',x.color);if(color===null)return;go(async()=>{await api('POST','/api/admin/tiers',{op:'save',id,name,min_amount:nn(amount),icon,color});S.tiers=await api('GET','/api/admin/tiers');draw();toast('رتبه ویرایش شد')})()};
const deleteTier=go(async id=>{if(!confirm('این رتبه حذف شود؟'))return;await api('POST','/api/admin/tiers',{op:'delete',id});S.tiers=await api('GET','/api/admin/tiers');draw()});
function aInvoices(){const h=S.invoiceHistory||{purchase:[],sales:[]},p=h.purchase||[],s=h.sales||[];return `<div class="card"><h3>🧾 تاریخچه فاکتورها</h3><div class="mu">حذف فاکتور فروش، سفارش تکمیل‌شده و امتیاز خرید مشتری را اصلاح می‌کند. حذف فاکتور خرید، موجودی را کاهش می‌دهد.</div></div><div class="card"><b>فاکتورهای فروش به مشتری</b>${s.map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span><b>${esc(x.customer_name)}</b><div class="mu">${esc(x.customer_phone||'')} · ${esc(x.date)} · ${T(x.total)}</div></span><button class="d" onclick="deleteInvoice('sale',${x.id})">حذف</button></div>`).join('')||'<div class="mu">فاکتور فروشی ثبت نشده است.</div>'}</div><div class="card"><b>فاکتورهای خرید انبار</b>${p.map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span><b>${esc(x.seller||'فروشنده ثبت نشده')}</b><div class="mu">${esc(x.date)} · ${T(x.total)}</div></span><button class="d" onclick="deleteInvoice('purchase',${x.id})">حذف</button></div>`).join('')||'<div class="mu">فاکتور خریدی ثبت نشده است.</div>'}</div>`}
const loadInvoices=go(async()=>{S.invoiceHistory=await api('GET','/api/admin/invoices/history');draw()});
const deleteInvoice=go(async(kind,id)=>{if(!confirm('فاکتور حذف شود؟ این عملیات روی موجودی یا مجموع خرید مشتری اثر می‌گذارد.'))return;await api('DELETE',`/api/admin/invoices/${kind}/${id}`);S.invoiceHistory=await api('GET','/api/admin/invoices/history');await load();draw();toast('فاکتور حذف شد و محاسبات به‌روزرسانی شد')});
function aPrice(){const pv=S.prev;return `<div class="card"><b>تغییر گروهی قیمت فروش</b><select id="p_cat"><option value="">همه محصولات</option>${S.set.categories.map(c=>`<option>${c}</option>`).join('')}</select>
 <div class="g2"><select id="p_mode"><option value="pct">درصد (+ افزایش / − کاهش)</option><option value="fix">مبلغ ثابت (تومان)</option></select><input id="p_val" inputmode="decimal" placeholder="مثلاً 15 یا -10"></div>
 <select id="p_rnd"><option value="1">بدون گرد کردن</option><option value="1000">گرد به هزار تومان</option><option value="10000">گرد به ده‌هزار تومان</option></select><button class="p" onclick="prevPrice()">پیش‌نمایش</button></div>
 ${pv?`<div class="card"><b>پیش‌نمایش (${fa(pv.rows.length)} محصول)</b><table><tr><th>کالا</th><th>قبلی</th><th>جدید</th></tr>${pv.rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${fa(r.old)}</td><td class="pr">${fa(r.new)}</td></tr>`).join('')}</table><div class="row" style="margin-top:8px"><button class="p" onclick="applyPrice()">تأیید و اعمال</button><button onclick="S.prev=null;draw()">لغو</button></div></div>`:''}
 ${S.last?`<div class="card">آخرین تغییر اعمال شد. <button class="d" onclick="revertPrice()">برگشت به قیمت قبلی</button></div>`:''}`}
const pb=()=>({category:val('p_cat')||undefined,mode:val('p_mode'),value:val('p_val'),round:+val('p_rnd')});
const prevPrice=go(async()=>{const r=await api('POST','/api/admin/prices',{...pb(),preview:true});if(!r.rows.length)return toast('هیچ قیمتی تغییر نمی‌کند');S.prev={...pb(),rows:r.rows};draw()});
const applyPrice=go(async()=>{const{rows,...b}=S.prev;const r=await api('POST','/api/admin/prices',b);S.last=r.batch;S.prev=null;await load();draw();toast('قیمت‌ها تغییر کرد')});
const revertPrice=go(async()=>{if(!confirm('قیمت‌ها به مقدار قبلی برگردند؟'))return;await api('POST','/api/admin/prices/revert',{batch:S.last});S.last=null;await load();draw();toast('برگشت داده شد')});
const aCusts=()=>S.custs.map(c=>`<div class="card"><b>${esc(c.name)}</b><div class="mu">${esc(c.phone)} · ${esc(c.city)}<br>${esc(c.address)}<br>عضویت: ${dt(c.created_at)} · سفارش‌ها: ${fa(c.orders)}</div></div>`).join('')||'<div class="card mu">مشتری ثبت‌نام نکرده است.</div>';
function aSet(){return appearance()+`<div class="card"><b>تنظیمات فروشگاه</b><input id="s_name" placeholder="نام فروشگاه" value="${esc(S.set.shop_name)}"><input id="s_phone" placeholder="تلفن" value="${esc(S.set.phone)}"><textarea id="s_addr">${esc(S.set.address)}</textarea><b>اطلاعات واریز (به مشتری نمایش داده می‌شود)</b><input id="s_card" inputmode="numeric" placeholder="شماره کارت" value="${esc(S.set.bank_card)}"><input id="s_acc" placeholder="شماره حساب / شبا" value="${esc(S.set.bank_account)}"><input id="s_own" placeholder="نام صاحب حساب" value="${esc(S.set.bank_owner)}"><button class="p" onclick="saveSet()">ذخیره</button></div>
 <div class="card"><b>تغییر نام کاربری</b><input id="un_new" placeholder="نام کاربری جدید (انگلیسی)"><input id="un_pw" type="password" placeholder="رمز فعلی"><button class="p" onclick="chUser('/api/admin/username')">تغییر نام کاربری</button></div>
 <div class="card"><b>پشتیبان‌گیری</b><div class="mu">فایل دیتابیس (محصولات، مشتریان، سفارش‌ها) را روی گوشی ذخیره کنید. عکس‌ها در آن نیستند.</div><button onclick="dlBackup()">دانلود پشتیبان</button></div>
 <div class="card"><b>تغییر رمز مدیر</b><input id="pw1" type="password" placeholder="رمز فعلی"><input id="pw2" type="password" placeholder="رمز جدید (حداقل ۸ کاراکتر)"><input id="pw3" placeholder="کلمه بازیابی جدید (اختیاری)"><button class="p" onclick="chPw('/api/admin/password')">تغییر رمز</button></div><div class="card"><b>تنظیم کلمه بازیابی مدیر</b><div class="mu">برای بازیابی رمز در آینده، یک کلمه محرمانه انتخاب کن.</div><input id="rc_pw" type="password" placeholder="رمز فعلی"><input id="rc_key_new" type="password" placeholder="کلمه بازیابی جدید (حداقل ۳ حرف)"><button class="p" onclick="setRecovery('/api/admin/recovery')">ذخیره کلمه بازیابی</button></div><button class="d w" onclick="logout()">خروج</button>`}
const saveSet=go(async()=>{await api('PUT','/api/admin/settings',{shop_name:val('s_name'),phone:val('s_phone'),address:val('s_addr'),bank_card:val('s_card'),bank_account:val('s_acc'),bank_owner:val('s_own')});S.set=await api('GET','/api/settings');draw();toast('ذخیره شد')});

go(boot)();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script>
</body></html>
